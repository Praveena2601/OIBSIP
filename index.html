<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Temperature Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

<!-- ==========================================================================
     STYLE (style.css contents)
     ========================================================================== -->
<style>
  /* -------------------- Design tokens -------------------- */
  :root {
    --font-display: "Poppins", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "JetBrains Mono", monospace;

    --glass-bg: rgba(255, 255, 255, 0.10);
    --glass-bg-strong: rgba(255, 255, 255, 0.16);
    --glass-border: rgba(255, 255, 255, 0.28);
    --text-primary: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.66);

    --accent-cold: #4facfe;
    --accent-warm: #f7971e;
    --accent-hot: #ff5f6d;
    --accent-violet: #a78bfa;
    --feel-color: var(--accent-cold);
    --feel-color-2: var(--accent-violet);

    --error: #ff6b6b;

    --radius-xl: 30px;
    --radius-lg: 22px;
    --radius-md: 15px;
    --radius-sm: 11px;

    --shadow-card: 0 40px 90px -25px rgba(0, 0, 0, 0.6);
  }

  [data-theme="light"] {
    --bg-1: #a8c0ff;
    --bg-2: #f7c8e0;
    --bg-3: #ffe29f;
    --bg-4: #a1ffce;
    --glass-bg: rgba(255, 255, 255, 0.32);
    --glass-bg-strong: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.65);
    --text-primary: #1c1e2b;
    --text-muted: rgba(28, 30, 43, 0.6);
  }

  [data-theme="dark"] {
    --bg-1: #0b0a1f;
    --bg-2: #2c1e63;
    --bg-3: #14123a;
    --bg-4: #3a1b52;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--text-primary);
    overflow-x: hidden;
    background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-4));
    background-size: 400% 400%;
    animation: gradientFlow 16s ease infinite;
    transition: color 0.4s ease;
  }

  @keyframes gradientFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* -------------------- Grain overlay (premium texture) -------------------- */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: overlay;
  }

  /* -------------------- Decorative floating blobs (glow, screen blend) -------------------- */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.65;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .blob--1 { width: 380px; height: 380px; background: var(--accent-cold); top: -100px; left: -80px; animation: floatA 15s ease-in-out infinite; }
  .blob--2 { width: 340px; height: 340px; background: var(--accent-hot); bottom: -120px; right: -70px; animation: floatB 17s ease-in-out infinite; }
  .blob--3 { width: 260px; height: 260px; background: var(--accent-warm); bottom: 22%; left: 6%; animation: floatC 13s ease-in-out infinite; }
  .blob--4 { width: 220px; height: 220px; background: var(--accent-violet); top: 12%; right: 12%; animation: floatB 19s ease-in-out infinite reverse; }
  @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(50px, 60px); } }
  @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px, -40px); } }
  @keyframes floatC { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px, -50px); } }

  /* -------------------- Layout shell -------------------- */
  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth;
  }

  /* -------------------- Header -------------------- */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 32px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.01em;
  }

  .brand-icon {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--accent-cold), var(--accent-violet));
    box-shadow: 0 8px 18px -6px rgba(79, 172, 254, 0.6);
  }
  .brand-icon svg { width: 18px; height: 18px; color: #fff; }

  .theme-toggle {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.25s ease, background 0.3s ease, box-shadow 0.3s ease;
  }
  .theme-toggle:hover { transform: translateY(-2px) scale(1.06); box-shadow: 0 10px 20px -8px rgba(0,0,0,0.4); }

  .theme-toggle svg {
    width: 20px;
    height: 20px;
    position: absolute;
    transition: opacity 0.35s ease, transform 0.45s ease;
  }
  .icon-sun { color: #ffd166; opacity: 0; transform: rotate(-90deg) scale(0.6); }
  .icon-moon { color: #dce4ff; opacity: 1; transform: rotate(0) scale(1); }
  [data-theme="light"] .icon-sun { opacity: 1; transform: rotate(0) scale(1); }
  [data-theme="light"] .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.6); }

  /* -------------------- Main / Card -------------------- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 20px 40px;
    perspective: 1400px;
  }

  .card-shell {
    position: relative;
    width: 100%;
    max-width: 460px;
    animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes cardEntrance {
    from { opacity: 0; transform: translateY(28px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* rotating glow ring behind the card */
  .card-glow {
    position: absolute;
    inset: -3px;
    border-radius: calc(var(--radius-xl) + 3px);
    background: conic-gradient(from 0deg, var(--accent-cold), var(--accent-violet), var(--accent-hot), var(--accent-warm), var(--accent-cold));
    filter: blur(18px);
    opacity: 0.55;
    z-index: 0;
    animation: rotateGlow 8s linear infinite;
  }
  @keyframes rotateGlow { to { filter: blur(18px) hue-rotate(360deg); } }

  .card {
    position: relative;
    z-index: 1;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    padding: 38px 32px 32px;
    transition: box-shadow 0.5s ease, transform 0.12s ease-out;
    transform-style: preserve-3d;
    will-change: transform;
    overflow: hidden;
  }

  /* cursor-follow spotlight sheen */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,0.30), transparent 45%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
    z-index: 2;
  }
  .card:hover::before { opacity: 1; }

  .card > * { position: relative; z-index: 1; }

  .card-heading {
    text-align: center;
    margin-bottom: 22px;
  }

  .card-heading .eyebrow {
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .eyebrow-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-cold);
    box-shadow: 0 0 8px 2px var(--accent-cold);
    animation: pulseDot 1.6s ease-in-out infinite;
  }

  .card-heading h1 {
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 700;
    margin: 8px 0 0;
  }

  /* -------------------- Hero live readout -------------------- */
  .hero-readout {
    text-align: center;
    margin: 22px 0 6px;
    min-height: 74px;
  }

  .hero-value {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(46px, 12vw, 60px);
    line-height: 1;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--feel-color), var(--feel-color-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: background 0.5s ease;
    display: inline-block;
  }
  .hero-value.pop { animation: heroPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes heroPop { 0% { transform: scale(0.9); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

  .hero-unit {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    color: var(--text-muted);
    margin-left: 4px;
  }

  .hero-caption {
    font-size: 12.5px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 6px;
    min-height: 16px;
  }

  /* sparkle burst container */
  .sparkle-field {
    position: relative;
    height: 0;
  }
  .sparkle {
    position: absolute;
    left: 50%;
    top: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--feel-color);
    box-shadow: 0 0 8px 1px var(--feel-color);
    animation: sparkleFly 0.7s ease-out forwards;
    pointer-events: none;
  }
  @keyframes sparkleFly {
    0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
  }

  /* -------------------- Segmented control -------------------- */
  .segmented {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 5px;
    margin: 18px 0 20px;
  }
  [data-theme="light"] .segmented { background: rgba(255, 255, 255, 0.28); }

  .segment-indicator {
    position: absolute;
    top: 5px;
    left: 5px;
    width: calc(33.333% - 3.33px);
    height: calc(100% - 10px);
    background: linear-gradient(135deg, var(--accent-cold), var(--accent-violet));
    border-radius: calc(var(--radius-md) - 5px);
    transition: transform 0.35s cubic-bezier(0.65, 0, 0.35, 1);
    box-shadow: 0 6px 18px -4px rgba(79, 172, 254, 0.55);
  }

  .segment {
    position: relative;
    z-index: 1;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    padding: 10px 0;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: color 0.3s ease, transform 0.15s ease;
  }
  .segment:hover { color: var(--text-primary); }
  .segment.active { color: #fff; }
  .segment:active { transform: scale(0.95); }

  /* -------------------- Input -------------------- */
  .input-group {
    position: relative;
    margin-bottom: 8px;
  }

  .input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--text-muted);
    pointer-events: none;
    transition: color 0.3s ease;
    z-index: 1;
  }

  #tempInput {
    width: 100%;
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    background: rgba(0, 0, 0, 0.18);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 15px 16px 15px 48px;
    outline: none;
    position: relative;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.3s ease;
  }
  [data-theme="light"] #tempInput { background: rgba(255, 255, 255, 0.42); }

  #tempInput::placeholder { color: var(--text-muted); font-weight: 500; font-family: var(--font-body); }

  #tempInput:focus {
    border-color: var(--feel-color);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--feel-color) 25%, transparent);
  }

  #tempInput.invalid {
    border-color: var(--error);
    box-shadow: 0 0 0 5px rgba(255, 107, 107, 0.18);
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    20%, 60% { transform: translateX(-4px); }
    40%, 80% { transform: translateX(4px); }
  }
  #tempInput.invalid ~ .input-icon { color: var(--error); }

  .error-msg {
    min-height: 20px;
    margin: 10px 2px 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--error);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .error-msg.visible { opacity: 1; transform: translateY(0); }

  /* -------------------- Actions -------------------- */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }

  .btn {
    position: relative;
    overflow: hidden;
    border: none;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.3s ease;
  }

  .btn-clear {
    flex: 1;
    padding: 13px 18px;
    background: rgba(0, 0, 0, 0.16);
    color: var(--text-primary);
    border: 1.5px solid var(--glass-border);
  }
  .btn-clear:hover { transform: translateY(-2px); background: rgba(0, 0, 0, 0.26); }

  .btn-live {
    flex: 1.4;
    padding: 13px 18px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent-cold), var(--accent-violet) 55%, var(--accent-hot));
    background-size: 200% 200%;
    background-position: 0% 50%;
    box-shadow: 0 14px 26px -10px rgba(79, 172, 254, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-live:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 32px -10px rgba(79, 172, 254, 0.7);
    background-position: 100% 50%;
  }
  .btn-live:active { transform: translateY(0) scale(0.98); }

  .btn .pulse-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #fff;
    animation: pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

  /* Ripple micro-interaction */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim { to { transform: scale(2.8); opacity: 0; } }

  /* -------------------- Feel badge -------------------- */
  .feel-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    padding: 6px 14px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--feel-color) 22%, transparent);
    border: 1px solid color-mix(in srgb, var(--feel-color) 45%, transparent);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease, background 0.4s ease, border-color 0.4s ease;
  }
  .feel-badge.visible { opacity: 1; transform: translateY(0); }
  .feel-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--feel-color); box-shadow: 0 0 8px 2px var(--feel-color); }

  /* -------------------- Results -------------------- */
  .results {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .result-card {
    padding: 16px 10px;
    text-align: center;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
  }
  .results.revealed .result-card { opacity: 1; transform: translateY(0); }
  .results.revealed .result-card:nth-child(1) { transition-delay: 0.02s; }
  .results.revealed .result-card:nth-child(2) { transition-delay: 0.09s; }
  .results.revealed .result-card:nth-child(3) { transition-delay: 0.16s; }

  .result-card.active-unit {
    border-color: var(--feel-color);
    box-shadow: 0 12px 26px -14px color-mix(in srgb, var(--feel-color) 80%, transparent);
    background: color-mix(in srgb, var(--feel-color) 14%, var(--glass-bg-strong));
  }

  .result-symbol {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .result-value {
    font-family: var(--font-mono);
    font-size: 17px;
    font-weight: 700;
  }

  /* -------------------- Footer -------------------- */
  footer {
    text-align: center;
    padding: 18px 20px 26px;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  footer strong {
    background: linear-gradient(135deg, var(--accent-cold), var(--accent-violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }

  /* -------------------- Responsive -------------------- */
  @media (max-width: 480px) {
    .site-header { padding: 22px 18px; }
    .card { padding: 30px 20px 24px; }
    .card-heading h1 { font-size: 21px; }
    .hero-value { font-size: 44px; }
    #tempInput { font-size: 18px; }
    .results { gap: 8px; }
    .result-value { font-size: 14.5px; }
  }

  @media (hover: none) {
    .card::before { display: none; }
  }
</style>
</head>
<body data-theme="dark">

<!-- Subtle grain texture for premium depth -->
<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>

<!-- Decorative animated glow blobs -->
<div class="blob blob--1"></div>
<div class="blob blob--2"></div>
<div class="blob blob--3"></div>
<div class="blob blob--4"></div>

<div class="app">

  <!-- ======================= HEADER ======================= -->
  <header class="site-header">
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
      </span>
      Smart Temperature Converter
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </header>

  <!-- ======================= MAIN CARD ======================= -->
  <main>
    <div class="card-shell">
      <div class="card-glow" aria-hidden="true"></div>
      <div class="card" id="card">

        <div class="card-heading">
          <div class="eyebrow"><span class="eyebrow-dot"></span> Real-time conversion</div>
          <h1>Convert any temperature</h1>
        </div>

        <!-- Hero live readout -->
        <div class="hero-readout">
          <span class="hero-value" id="heroValue">0.0</span><span class="hero-unit" id="heroUnit">°C</span>
        </div>
        <div class="hero-caption" id="heroCaption">Enter a value to begin</div>
        <div class="sparkle-field" id="sparkleField"></div>

        <!-- Unit segmented control -->
        <div class="segmented" id="segmented" role="tablist" aria-label="Select input unit">
          <div class="segment-indicator" id="segIndicator"></div>
          <button type="button" class="segment active" data-unit="C" role="tab" aria-selected="true">°C</button>
          <button type="button" class="segment" data-unit="F" role="tab" aria-selected="false">°F</button>
          <button type="button" class="segment" data-unit="K" role="tab" aria-selected="false">K</button>
        </div>

        <!-- Input -->
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
          <input
            type="text"
            inputmode="decimal"
            id="tempInput"
            placeholder="Enter temperature…"
            autocomplete="off"
            aria-label="Temperature value"
          >
        </div>
        <div class="error-msg" id="errorMsg" role="alert"></div>

        <!-- Feel badge (cold / warm / hot) -->
        <span class="feel-badge" id="feelBadge">
          <span class="feel-dot"></span>
          <span id="feelText">—</span>
        </span>

        <!-- Actions -->
        <div class="actions">
          <button type="button" class="btn btn-clear" id="clearBtn">Clear</button>
          <button type="button" class="btn btn-live" id="liveBtn">
            <span class="pulse-dot"></span>
            Live
          </button>
        </div>

        <!-- Results -->
        <div class="results" id="results">
          <div class="result-card" data-unit="C">
            <span class="result-symbol">CELSIUS</span>
            <span class="result-value" id="resultC">—</span>
          </div>
          <div class="result-card" data-unit="F">
            <span class="result-symbol">FAHRENHEIT</span>
            <span class="result-value" id="resultF">—</span>
          </div>
          <div class="result-card" data-unit="K">
            <span class="result-symbol">KELVIN</span>
            <span class="result-value" id="resultK">—</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- ======================= FOOTER ======================= -->
  <footer>
    Built by <strong>Praveena R</strong>
  </footer>

</div>

<!-- ==========================================================================
     SCRIPT (script.js contents)
     ========================================================================== -->
<script>
(() => {
  "use strict";

  /* ---------------------------------------------------------
     Element references
  --------------------------------------------------------- */
  const body = document.body;
  const themeToggle = document.getElementById("themeToggle");

  const segmented = document.getElementById("segmented");
  const segIndicator = document.getElementById("segIndicator");
  const segments = Array.from(document.querySelectorAll(".segment"));

  const tempInput = document.getElementById("tempInput");
  const errorMsg = document.getElementById("errorMsg");
  const clearBtn = document.getElementById("clearBtn");
  const liveBtn = document.getElementById("liveBtn");

  const feelBadge = document.getElementById("feelBadge");
  const feelText = document.getElementById("feelText");

  const results = document.getElementById("results");
  const resultC = document.getElementById("resultC");
  const resultF = document.getElementById("resultF");
  const resultK = document.getElementById("resultK");

  const heroValue = document.getElementById("heroValue");
  const heroUnit = document.getElementById("heroUnit");
  const heroCaption = document.getElementById("heroCaption");
  const sparkleField = document.getElementById("sparkleField");

  const card = document.getElementById("card");

  let currentUnit = "C";

  /* ---------------------------------------------------------
     Theme (dark / light) — persisted via localStorage
  --------------------------------------------------------- */
  function applyTheme(theme) {
    body.setAttribute("data-theme", theme);
    try { localStorage.setItem("temp-converter-theme", theme); } catch (e) { /* ignore */ }
  }

  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem("temp-converter-theme"); } catch (e) { /* ignore */ }
    const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    applyTheme(saved || (prefersLight ? "light" : "dark"));
  })();

  themeToggle.addEventListener("click", () => {
    const next = body.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
  });

  /* ---------------------------------------------------------
     3D tilt + cursor spotlight on the card
  --------------------------------------------------------- */
  card.addEventListener("mousemove", (e) => {
    const rect = card.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;   // 0 - 1
    const py = (e.clientY - rect.top) / rect.height;    // 0 - 1

    const rotateY = (px - 0.5) * 10;   // left-right tilt
    const rotateX = (0.5 - py) * 8;    // up-down tilt

    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    card.style.setProperty("--mx", `${px * 100}%`);
    card.style.setProperty("--my", `${py * 100}%`);
  });

  card.addEventListener("mouseleave", () => {
    card.style.transform = "rotateX(0deg) rotateY(0deg)";
  });

  /* ---------------------------------------------------------
     Segmented control (unit selector)
  --------------------------------------------------------- */
  function setActiveSegment(unit, animate = true) {
    currentUnit = unit;
    const index = segments.findIndex((s) => s.dataset.unit === unit);

    segIndicator.style.transition = animate
      ? "transform 0.35s cubic-bezier(0.65, 0, 0.35, 1)"
      : "none";
    segIndicator.style.transform = `translateX(${index * 100}%)`;

    segments.forEach((s) => {
      const active = s.dataset.unit === unit;
      s.classList.toggle("active", active);
      s.setAttribute("aria-selected", active ? "true" : "false");
    });

    tempInput.placeholder = `Enter temperature in ${unitLabel(unit)}…`;
    heroUnit.textContent = unitSymbol(unit);
  }

  segments.forEach((segment) => {
    segment.addEventListener("click", (e) => {
      spawnRipple(segment, e);
      setActiveSegment(segment.dataset.unit);
      runConversion();
    });
  });

  function unitLabel(unit) {
    return unit === "C" ? "Celsius" : unit === "F" ? "Fahrenheit" : "Kelvin";
  }
  function unitSymbol(unit) {
    return unit === "K" ? "K" : `°${unit}`;
  }

  /* ---------------------------------------------------------
     Absolute-zero limits
  --------------------------------------------------------- */
  const ABS_ZERO = { C: -273.15, F: -459.67, K: 0 };

  /* ---------------------------------------------------------
     Conversion core
  --------------------------------------------------------- */
  function toCelsius(value, unit) {
    if (unit === "C") return value;
    if (unit === "F") return (value - 32) * (5 / 9);
    return value - 273.15; // K
  }

  function fromCelsius(c) {
    return { C: c, F: (c * 9) / 5 + 32, K: c + 273.15 };
  }

  function formatNum(n) {
    const rounded = Math.round(n * 100) / 100;
    return Number.isInteger(rounded) ? rounded.toFixed(1) : rounded.toString();
  }

  /* ---------------------------------------------------------
     Validation
  --------------------------------------------------------- */
  function validate(raw, unit) {
    if (raw.trim() === "") {
      return { ok: false, message: "" }; // empty = neutral state, no error shown
    }
    const numericPattern = /^-?\d+(\.\d+)?$/;
    if (!numericPattern.test(raw.trim())) {
      return { ok: false, message: "Numbers only, please — try something like -12 or 36.6." };
    }
    const value = parseFloat(raw);
    if (!Number.isFinite(value)) {
      return { ok: false, message: "That value is too large to convert." };
    }
    if (value < ABS_ZERO[unit]) {
      return {
        ok: false,
        message: `That's below absolute zero. The lowest possible value in ${unitLabel(unit)} is ${formatNum(ABS_ZERO[unit])}${unitSymbol(unit)}.`,
      };
    }
    return { ok: true, value };
  }

  /* ---------------------------------------------------------
     Temperature-based color feedback
  --------------------------------------------------------- */
  function updateFeel(celsius) {
    let varName, label;
    if (celsius < 15) { varName = "--accent-cold"; label = "Cold"; }
    else if (celsius <= 30) { varName = "--accent-warm"; label = "Warm"; }
    else { varName = "--accent-hot"; label = "Hot"; }

    const resolved = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    card.style.setProperty("--feel-color", resolved);
    card.style.setProperty("--feel-color-2", "var(--accent-violet)");
    feelText.textContent = label;
    feelBadge.classList.add("visible");
  }

  function resetFeel() {
    feelBadge.classList.remove("visible");
    card.style.removeProperty("--feel-color");
    card.style.removeProperty("--feel-color-2");
  }

  /* ---------------------------------------------------------
     Error display
  --------------------------------------------------------- */
  function showError(message) {
    errorMsg.textContent = message;
    errorMsg.classList.toggle("visible", Boolean(message));
    // Re-trigger the shake animation even if already invalid
    tempInput.classList.remove("invalid");
    void tempInput.offsetWidth;
    tempInput.classList.add("invalid");
  }
  function clearError() {
    errorMsg.textContent = "";
    errorMsg.classList.remove("visible");
    tempInput.classList.remove("invalid");
  }

  /* ---------------------------------------------------------
     Hero readout + sparkle burst
  --------------------------------------------------------- */
  function updateHero(value, unit) {
    heroValue.textContent = formatNum(value);
    heroUnit.textContent = unitSymbol(unit);
    heroCaption.textContent = `That's how it feels in ${unitLabel(unit)}`;

    heroValue.classList.remove("pop");
    void heroValue.offsetWidth; // restart animation
    heroValue.classList.add("pop");

    spawnSparkles();
  }

  function resetHero() {
    heroValue.textContent = "0.0";
    heroCaption.textContent = "Enter a value to begin";
  }

  function spawnSparkles() {
    const count = 6;
    for (let i = 0; i < count; i++) {
      const s = document.createElement("span");
      s.className = "sparkle";
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const distance = 40 + Math.random() * 30;
      s.style.setProperty("--sx", `${Math.cos(angle) * distance}px`);
      s.style.setProperty("--sy", `${Math.sin(angle) * distance - 20}px`);
      sparkleField.appendChild(s);
      s.addEventListener("animationend", () => s.remove());
    }
  }

  /* ---------------------------------------------------------
     Results display
  --------------------------------------------------------- */
  function showResults(values) {
    resultC.textContent = `${formatNum(values.C)}°`;
    resultF.textContent = `${formatNum(values.F)}°`;
    resultK.textContent = `${formatNum(values.K)}`;

    document.querySelectorAll(".result-card").forEach((el) => {
      el.classList.toggle("active-unit", el.dataset.unit === currentUnit);
    });

    results.classList.add("revealed");
  }
  function hideResults() {
    results.classList.remove("revealed");
  }

  /* ---------------------------------------------------------
     Main conversion runner (real-time)
  --------------------------------------------------------- */
  function runConversion() {
    const raw = tempInput.value;

    if (raw.trim() === "") {
      clearError();
      hideResults();
      resetFeel();
      resetHero();
      return;
    }

    const check = validate(raw, currentUnit);

    if (!check.ok) {
      if (check.message) showError(check.message);
      else clearError();
      hideResults();
      resetFeel();
      resetHero();
      return;
    }

    clearError();
    const celsius = toCelsius(check.value, currentUnit);
    const values = fromCelsius(celsius);
    showResults(values);
    updateFeel(celsius);
    updateHero(check.value, currentUnit);
  }

  /* ---------------------------------------------------------
     Clear button — smooth reset
  --------------------------------------------------------- */
  function handleClear(e) {
    spawnRipple(clearBtn, e);
    tempInput.value = "";
    clearError();
    hideResults();
    resetFeel();
    resetHero();
    tempInput.focus();
  }

  /* ---------------------------------------------------------
     Ripple micro-interaction
  --------------------------------------------------------- */
  function spawnRipple(el, event) {
    const rect = el.getBoundingClientRect();
    const ripple = document.createElement("span");
    const size = Math.max(rect.width, rect.height);
    const x = (event.clientX ?? rect.left + rect.width / 2) - rect.left - size / 2;
    const y = (event.clientY ?? rect.top + rect.height / 2) - rect.top - size / 2;

    ripple.className = "ripple";
    ripple.style.width = ripple.style.height = `${size}px`;
    ripple.style.left = `${x}px`;
    ripple.style.top = `${y}px`;

    el.style.position = el.style.position || "relative";
    el.appendChild(ripple);
    ripple.addEventListener("animationend", () => ripple.remove());
  }

  /* ---------------------------------------------------------
     Event wiring
  --------------------------------------------------------- */
  tempInput.addEventListener("input", runConversion);
  clearBtn.addEventListener("click", handleClear);
  liveBtn.addEventListener("click", (e) => {
    spawnRipple(liveBtn, e);
    runConversion();
    tempInput.focus();
  });

  /* ---------------------------------------------------------
     Init
  --------------------------------------------------------- */
  setActiveSegment("C", false);
})();
</script>

</body>
</html>
